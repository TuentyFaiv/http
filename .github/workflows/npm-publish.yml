name: Publish package

on:
  release:
    types:
      - published

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Verify release package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      dist-tag: ${{ steps.release.outputs.dist-tag }}
      tarball-sha256: ${{ steps.pack.outputs.tarball-sha256 }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Setup Node for packed consumer
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Verify release tag
        id: release
        run: bun scripts/verify-release.mjs

      - name: Check lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build package
        run: bun run build

      - name: Pack release once
        id: pack
        run: |
          mkdir -p .temp/release-artifact
          bun pm pack --ignore-scripts --filename .temp/release-artifact/package.tgz
          checksum="$(sha256sum .temp/release-artifact/package.tgz)"
          printf 'tarball-sha256=%s\n' "${checksum%% *}" >> "$GITHUB_OUTPUT"

      - name: Test exact release tarball
        run: bun scripts/package-smoke.mjs .temp/release-artifact/package.tgz

      - name: Verify tested tarball and summarize release
        env:
          EXPECTED_SHA256: ${{ steps.pack.outputs.tarball-sha256 }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DIST_TAG: ${{ steps.release.outputs.dist-tag }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          const actual = createHash("sha256").update(readFileSync(".temp/release-artifact/package.tgz")).digest("hex");
          if (actual !== process.env.EXPECTED_SHA256) {
            throw new Error("Release tarball checksum mismatch");
          }
          NODE
          {
            printf '## Tested release package\n\n'
            printf -- '- Release: %s\n' "$RELEASE_TAG"
            printf -- '- Commit: %s\n' "$RELEASE_SHA"
            printf -- '- npm dist-tag: %s\n' "$DIST_TAG"
            printf -- '- Tarball SHA-256: %s\n' "$EXPECTED_SHA256"
            printf '\nReview this commit and artifact before approving the npm environment.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload tested release tarball
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fetchzen-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: .temp/release-artifact/package.tgz
          # The exact file is staged under .temp; never broaden this to a directory.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # No checkout, dependency installation, or repository scripts in this job.
      - name: Setup Node for npm Trusted Publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download tested release tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/fetchzen-release

      - name: Verify and publish tested tarball
        working-directory: ${{ runner.temp }}/fetchzen-release
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.tarball-sha256 }}
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
        run: |
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          const actual = createHash("sha256").update(readFileSync("package.tgz")).digest("hex");
          if (actual !== process.env.EXPECTED_SHA256) {
            throw new Error("Release tarball checksum mismatch");
          }
          NODE
          case "$DIST_TAG" in beta|latest) ;; *) exit 1 ;; esac
          npm publish ./package.tgz --access public --provenance --ignore-scripts --tag "$DIST_TAG"
