name: Deploy docs to Workers

on:
  workflow_dispatch:

concurrency:
  group: cloudflare-docs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-docs
    env:
      DOCS_SITE: ${{ vars.DOCS_SITE }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Validate deployment configuration
        run: |
          test -n "$DOCS_SITE" || { echo "Set DOCS_SITE to the public site origin."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Set CLOUDFLARE_ACCOUNT_ID."; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Set CLOUDFLARE_API_TOKEN."; exit 1; }

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Check source and tests
        run: bun run check && bun run typecheck && bun run test

      - name: Build docs
        run: bun run docs:build

      - name: Deploy Worker and static assets
        working-directory: docs
        run: bun x --no-install wrangler deploy
